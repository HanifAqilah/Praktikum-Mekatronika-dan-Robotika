; PlatformIO Project Configuration File
; Modul 4: Sensor Fusion & Conditioning
;
; Build profiles for ESP32 and Arduino Mega

[platformio]
default_envs = esp32dev

; ============================================================================
; COMMON SETTINGS
; ============================================================================

[common]
lib_deps = 
    adafruit/Adafruit MPU6050@^2.2.4
    adafruit/Adafruit Unified Sensor@^1.1.9
    wire
monitor_speed = 115200
build_flags = 
    -D FIRMWARE_VERSION=\"1.0.0\"
    -D MODULE_NAME=\"Modul 4: Sensor Fusion\"

; ============================================================================
; ESP32 ENVIRONMENT
; ============================================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
build_flags = 
    ${common.build_flags}
    -D BOARD_ESP32=1
    -D DEBUG_MODE=1
upload_speed = 921600
monitor_filters = 
    colorize
    time

; ESP32 - Release build (no debug)
[env:esp32_release]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
build_flags = 
    ${common.build_flags}
    -D BOARD_ESP32=1
    -D DEBUG_MODE=0
    -O3
upload_speed = 921600

; ============================================================================
; ARDUINO MEGA ENVIRONMENT
; ============================================================================

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
build_flags = 
    ${common.build_flags}
    -D BOARD_MEGA=1
    -D DEBUG_MODE=1
upload_speed = 115200
monitor_filters = 
    colorize
    time

; Arduino Mega - Release build
[env:mega_release]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
build_flags = 
    ${common.build_flags}
    -D BOARD_MEGA=1
    -D DEBUG_MODE=0
    -O3
upload_speed = 115200
