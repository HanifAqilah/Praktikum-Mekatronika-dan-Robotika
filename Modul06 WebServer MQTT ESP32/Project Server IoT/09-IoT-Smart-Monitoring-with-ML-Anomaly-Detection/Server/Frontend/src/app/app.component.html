<mat-toolbar color="primary" *ngIf="isLoggedIn">
  <button mat-icon-button (click)="sidenav.toggle()">
    <mat-icon>menu</mat-icon>
  </button>
  <span>IoT Monitor – Percobaan 9</span>
  <span class="spacer" style="flex:1 1 auto;"></span>
  <button mat-icon-button routerLink="/alerts" matTooltip="Alerts">
    <mat-icon [matBadge]="activeAlertCount > 0 ? activeAlertCount : null"
              matBadgeColor="warn">notifications</mat-icon>
  </button>
  <button mat-button [matMenuTriggerFor]="userMenu">
    <mat-icon>account_circle</mat-icon> {{ username }}
  </button>
  <mat-menu #userMenu>
    <button mat-menu-item (click)="logout()">
      <mat-icon>logout</mat-icon> Logout
    </button>
  </mat-menu>
</mat-toolbar>

<mat-sidenav-container style="height: calc(100vh - 64px);" *ngIf="isLoggedIn">
  <mat-sidenav #sidenav mode="side" opened style="width:220px; padding-top:8px;">
    <mat-nav-list>
      <a mat-list-item *ngFor="let item of navItems" [routerLink]="item.route"
         routerLinkActive="active-link">
        <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
        <span matListItemTitle>{{ item.label }}</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content style="padding:16px; overflow-y:auto;">
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>

<div *ngIf="!isLoggedIn">
  <router-outlet></router-outlet>
</div>
