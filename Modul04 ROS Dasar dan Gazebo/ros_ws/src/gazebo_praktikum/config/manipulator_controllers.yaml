# Konfigurasi Controller Robot Manipulator 3-DOF
# Format ROS 2 Humble + ros2_control
# Digunakan pada Percobaan 9 (Manipulator)

controller_manager:
  ros__parameters:
    update_rate: 50  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_position_controller:
      type: position_controllers/JointGroupPositionController

arm_position_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3

joint_3_position_controller:
  ros__parameters:
    joints:
      - joint_3
