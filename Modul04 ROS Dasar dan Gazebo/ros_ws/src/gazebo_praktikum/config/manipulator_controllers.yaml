# Konfigurasi Controller Robot Manipulator 3-DOF
# Format ROS 2 Humble + ros2_control
# Digunakan pada Percobaan 8
#
# CATATAN: node berjalan di namespace /manipulator, sehingga kunci YAML
# harus menggunakan path lengkap agar parameter-mapping cocok.

/manipulator/controller_manager:
  ros__parameters:
    update_rate: 50  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_1_position_controller:
      type: position_controllers/JointGroupPositionController

    joint_2_position_controller:
      type: position_controllers/JointGroupPositionController

    joint_3_position_controller:
      type: position_controllers/JointGroupPositionController

/manipulator/joint_1_position_controller:
  ros__parameters:
    joints:
      - joint_1

/manipulator/joint_2_position_controller:
  ros__parameters:
    joints:
      - joint_2

/manipulator/joint_3_position_controller:
  ros__parameters:
    joints:
      - joint_3
